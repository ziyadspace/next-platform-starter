name: Install Ghallif redesign

on:
  push:
    paths:
      - ghallif-source.b64

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace project source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ghallif-source.b64 > /tmp/ghallif-redesign.zip
          mkdir -p /tmp/ghallif-redesign
          unzip -q /tmp/ghallif-redesign.zip -d /tmp/ghallif-redesign
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ghallif-redesign/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign Ghallif in neo-retro style"
          git push
