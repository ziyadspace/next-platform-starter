name: Install Ghallif prototype

on:
  push:
    paths:
      - ghallif-source.b64

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Rebuild and install Ghallif source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          archive_path="$RUNNER_TEMP/ghallif-source.zip"
          base64 --decode ghallif-source.b64 > "$archive_path"
          unzip -q "$archive_path" -d "$source_dir"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$source_dir"/. "$GITHUB_WORKSPACE"/

      - name: Commit Ghallif project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Netlify starter with Ghallif prototype"
          git push
